# CY Clash APP v2.0 | 2026-09-08 | Author: ChungyuCheung
# 依据 https://clash.md/zh/guide/config/best-practice 的最小模板及 MRS 建议。
# 完整配置方案：导入本地 YAML，在 Primary-VPS.url 填已有 Clash 格式节点来源。
# 如要沿用 APP 已有配置的节点，请使用同目录 cy-rules.js，无需填写本文件。
# 保留 cy.conf 的 MEXC 菲律宾 / Bybit 台湾 / PayPal 英国 / AI 代理策略。
# 大型域名/IP 规则改用官网模板实际引用的 3 个 MRS；少量 keyword/IP 补充内联。
# 补充规则基于 blackmatrix7 master 2026-09-08 快照，过滤 iOS 不匹配的 PROCESS 规则。
# 去掉 Global 大型规则集，以国内直连后 MATCH 代理兜底；泛用覆盖随上游版本变化，非逐条等价。
# 广告拦截关闭，Apple 直连保留原偏好，不采用社区模板的 APNs 代理策略。
# 不设 TUN/监听端口/控制器，由 APP 管理；IPv6 关闭沿用 cy.conf。
# fake-ip 模式不将 198.18.0.0/15 设为直连。
# UDP/443 拦截近似原 block-quic=all-proxy；MITM/STUN伪装未迁移。
# 地区组空时 REJECT，不自动切换至其他地区；请选择有对应节点的来源。
# 通过静态检查，尚未在你的 iPhone 上验证。
mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.internal
  - localhost
  - +.huitone.com
  - +.huinor.com
  - +.synology.me
proxy-providers:
  Primary-VPS:
    type: http
    url: "" # 仅在手机内填入已有节点来源地址
    path: ./providers/primary.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
proxy-groups:
- name: PROXY
  type: select
  use:
  - Primary-VPS
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇵🇭 菲律宾最快
  type: url-test
  use:
  - Primary-VPS
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇵🇭|菲律宾|菲律賓|马尼拉|馬尼拉|宿务|宿霧|\b((PH|PHL|MNL|CEB|Philippines|Manila|Cebu)([-_ ]?[0-9]+)?)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇹🇼 台湾最快
  type: url-test
  use:
  - Primary-VPS
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇹🇼|台湾|台灣|臺灣|台北|臺北|台中|臺中|高雄|新北|桃园|桃園|\b((TW|TWN|TPE|TSA|KHH|Taiwan|Taipei|Taichung|Kaohsiung)([-_ ]?[0-9]+)?)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇬🇧 英国最快
  type: url-test
  use:
  - Primary-VPS
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇬🇧|英国|英國|伦敦|倫敦|曼彻斯特|曼徹斯特|\b((UK|GB|GBR|LHR|LGW|MAN|London|Manchester)([-_ ]?[0-9]+)?|United Kingdom|Britain)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
rule-providers:
  CY-Apple_Domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://raw.githubusercontent.com/Sydney-Moses/Network-Profiles/refs/heads/main/MRS/Apple_Domain.mrs
    path: ./rules/cy-Apple_Domain.mrs
  CY-ChinaMax_Domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://raw.githubusercontent.com/Sydney-Moses/Network-Profiles/refs/heads/main/MRS/ChinaMax_Domain.mrs
    path: ./rules/cy-ChinaMax_Domain.mrs
  CY-ChinaMax_IP:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://raw.githubusercontent.com/Sydney-Moses/Network-Profiles/refs/heads/main/MRS/ChinaMax_IP.mrs
    path: ./rules/cy-ChinaMax_IP.mrs
