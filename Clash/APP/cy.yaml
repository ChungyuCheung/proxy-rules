# CN Fast + Global Proxy + AI — Clash APP v1.0
# Author: ChungyuCheung
# Updated: 2026-09-05
# Target: https://clash.md (Hako / mihomo)
# Source: Shadowrocket/cy.conf v5, blob 9eb18d00d14497dd47d7894d447d6d8b59c39082
# 使用前：把下面 proxy-providers -> 机场订阅 -> url 替换成自己的 Clash/mihomo 订阅。
# 这是完整配置，不是 Clash Verge 全局覆写脚本；原 cy.conf 未包含节点。
# 保留 MEXC 菲律宾 / Bybit 台湾 / PayPal 英国 / AI 代理 / Apple 与国内直连。
# 地区筛选拆为 filter + exclude-filter，避免 Go 正则不支持负向前瞻。
# 空组设置 empty-fallback: REJECT；导入后务必确认三个地区组都已有对应节点。
# 广告拦截默认关闭；启用方法见文件末尾注释。
# DNS 使用 redir-host，保留原国内 DNS，避免与原保留 IP 直连规则冲突。
# skip-proxy 中的自定义域名显式转为最前面的 DIRECT 规则。
# 代理路径前拦截 UDP/443，近似原 block-quic=all-proxy；并非精准 QUIC 协议识别。
# Apple Packet Tunnel 路由及 DNS 劫持由 APP 管理，不照搬 Shadowrocket TUN 字段。
# MITM / STUN 响应伪装 / UDP 不支持时的回退开关无直接等价转换，未迁移。
# 原文件没有 rewrite/script，本配置不解密 HTTPS；不保证原 STUN/WebRTC 行为。

mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
proxy-providers:
  机场订阅:
    type: http
    url: https://example.com/REPLACE_WITH_YOUR_CLASH_SUBSCRIPTION
    path: ./providers/airport.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
proxy-groups:
- name: PROXY
  type: select
  use:
  - 机场订阅
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇵🇭 菲律宾最快
  type: url-test
  use:
  - 机场订阅
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇵🇭|菲律宾|菲律賓|马尼拉|馬尼拉|宿务|宿霧|\b((PH|PHL|MNL|CEB|Philippines|Manila|Cebu)([-_ ]?[0-9]+)?)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇹🇼 台湾最快
  type: url-test
  use:
  - 机场订阅
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇹🇼|台湾|台灣|臺灣|台北|臺北|台中|臺中|高雄|新北|桃园|桃園|\b((TW|TWN|TPE|TSA|KHH|Taiwan|Taipei|Taichung|Kaohsiung)([-_ ]?[0-9]+)?)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
- name: 🇬🇧 英国最快
  type: url-test
  use:
  - 机场订阅
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  tolerance: 50
  filter: (?i)^.*(🇬🇧|英国|英國|伦敦|倫敦|曼彻斯特|曼徹斯特|\b((UK|GB|GBR|LHR|LGW|MAN|London|Manchester)([-_ ]?[0-9]+)?|United Kingdom|Britain)\b).*$
  exclude-filter: (?i)(剩余|剩餘|流量|到期|官网|官網|套餐|重置|公告|客服|traffic|expire|remaining|reset)
  empty-fallback: REJECT
